<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Broadcast Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header>
    <h1>Broadcast</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Not broadcasting</span></div>
  </header>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="placeholder" id="placeholder"></div>
    <div class="overlays" id="overlay"></div>
  </div>
  <div class="editor">
    <label>Text
      <input type="text" id="oText">
    </label>
    <label>Size
      <div class="row"><input type="range" id="oSize" min="2" max="30" step="0.5"><span id="oSizeVal"></span></div>
    </label>
    <label>Colour
      <input type="color" id="oColor">
    </label>
    <label>Height above head
      <div class="row"><input type="range" id="oHeight" min="-0.3" max="1" step="0.05"><span id="oHeightVal"></span></div>
    </label>
    <button type="button" class="toggle3d" id="o3d">3D text</button>
    <label class="toggle"><input type="checkbox" id="oVisible"> Show text</label>
    <label class="toggle"><input type="checkbox" id="oFollow"> Follow head</label>
    <div class="hint" id="trackStatus"></div>
  </div>
  <button id="toggle">Start broadcasting</button>
  <div class="meta" id="viewers">0 viewers</div>
  <div class="meta" id="startHint">Press Start to share this Mac's camera with viewers of the main page.</div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="config.js?v=8"></script>
  <script src="overlay.js?v=8"></script>
  <script>
    const video = document.getElementById("video");
    const placeholder = document.getElementById("placeholder");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const toggle = document.getElementById("toggle");
    const viewersEl = document.getElementById("viewers");

    // Overlay editor: settings are sent to every viewer over the data connection.
    const overlay = document.getElementById("overlay");
    const oText = document.getElementById("oText");
    const oSize = document.getElementById("oSize");
    const oSizeVal = document.getElementById("oSizeVal");
    const oColor = document.getElementById("oColor");
    const oHeight = document.getElementById("oHeight");
    const oHeightVal = document.getElementById("oHeightVal");
    const o3d = document.getElementById("o3d");
    const oVisible = document.getElementById("oVisible");
    const oFollow = document.getElementById("oFollow");
    const conns = new Set();
    const ov = createOverlay(overlay, video);

    let overlayState = {
      type: "overlay", text: "hello world", size: 8, color: "#ffffff",
      visible: true, follow: true, height: 0.15, depth: false,
    };
    try { Object.assign(overlayState, JSON.parse(localStorage.getItem("overlay") || "{}")); } catch {}

    function renderOverlay() {
      ov.setStyle(overlayState);
      oSizeVal.textContent = overlayState.size;
      oHeightVal.textContent = overlayState.height.toFixed(2);
      o3d.classList.toggle("on", overlayState.depth);
      o3d.textContent = overlayState.depth ? "3D text: on" : "3D text: off";
    }

    function onEdit() {
      overlayState = {
        type: "overlay",
        text: oText.value,
        size: Number(oSize.value),
        color: oColor.value,
        visible: oVisible.checked,
        follow: oFollow.checked,
        height: Number(oHeight.value),
        depth: overlayState.depth,
      };
      renderOverlay();
      try { localStorage.setItem("overlay", JSON.stringify(overlayState)); } catch {}
      conns.forEach(c => c.open && c.send(overlayState));
    }

    oText.value = overlayState.text;
    oSize.value = overlayState.size;
    oColor.value = overlayState.color;
    oHeight.value = overlayState.height;
    oVisible.checked = overlayState.visible;
    oFollow.checked = overlayState.follow;
    [oText, oSize, oColor, oHeight, oVisible, oFollow].forEach(el => el.addEventListener("input", onEdit));
    o3d.addEventListener("click", () => { overlayState.depth = !overlayState.depth; onEdit(); });
    renderOverlay();

    // Head tracking (tracking.js) reports every head it sees; viewers get them ~15x a second.
    window.headLift = () => overlayState.height;
    let lastSent = 0;
    window.onHeads = found => {
      const heads = overlayState.follow ? found : null;
      ov.setHeads(heads);
      const now = performance.now();
      if (now - lastSent < 66) return;
      lastSent = now;
      conns.forEach(c => c.open && c.send({ type: "heads", heads }));
    };

    let stream = null;
    let peer = null;
    const calls = new Map();

    function setStatus(text, live) {
      statusText.textContent = text;
      status.classList.toggle("live", !!live);
    }

    function updateViewers() {
      viewersEl.textContent = calls.size + (calls.size === 1 ? " viewer" : " viewers");
    }

    async function start() {
      toggle.disabled = true;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
      } catch (e) {
        setStatus("Camera blocked: " + e.name);
        toggle.disabled = false;
        return;
      }
      video.srcObject = stream;
      placeholder.style.display = "none";

      peer = new Peer(STREAM_ID);
      peer.on("open", () => {
        setStatus("Live", true);
        toggle.textContent = "Stop broadcasting";
        toggle.classList.add("stop");
        document.getElementById("startHint").hidden = true;
        toggle.disabled = false;
      });

      // Each viewer opens a data connection; we call them back with the video.
      peer.on("connection", conn => {
        conn.on("open", () => {
          conns.add(conn);
          conn.send(overlayState);
          const call = peer.call(conn.peer, stream);
          calls.set(conn.peer, call);
          updateViewers();
          const drop = () => { calls.delete(conn.peer); updateViewers(); };
          call.on("close", drop);
          conn.on("close", () => { conns.delete(conn); call.close(); drop(); });
        });
      });

      peer.on("disconnected", () => peer.reconnect());
      peer.on("error", err => {
        if (err.type === "unavailable-id") {
          setStatus("Already broadcasting in another tab");
          stop();
        } else if (err.type !== "peer-unavailable") {
          setStatus("Error: " + err.type);
        }
      });
    }

    function stop() {
      calls.forEach(c => c.close());
      calls.clear();
      conns.clear();
      updateViewers();
      if (peer) { peer.destroy(); peer = null; }
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      video.srcObject = null;
      placeholder.style.display = "";
      toggle.textContent = "Start broadcasting";
      toggle.classList.remove("stop");
      document.getElementById("startHint").hidden = false;
      ov.setHeads(null);
      toggle.disabled = false;
      if (!statusText.textContent.startsWith("Already")) setStatus("Not broadcasting");
    }

    toggle.addEventListener("click", () => (peer ? stop() : start()));
    window.addEventListener("beforeunload", stop);
  </script>
  <script type="module" src="tracking.js?v=8"></script>
</body>
</html>
