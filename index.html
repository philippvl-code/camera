<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Camera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header>
    <h1>Live Camera</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  </header>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="placeholder" id="placeholder">Waiting for the stream…</div>
    <div class="overlay" id="overlay" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="config.js?v=6"></script>
  <script src="overlay.js?v=6"></script>
  <script>
    const video = document.getElementById("video");
    const placeholder = document.getElementById("placeholder");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const overlay = document.getElementById("overlay");

    function applyOverlay(o) {
      overlay.textContent = o.text;
      overlay.style.fontSize = o.size + "cqw";
      overlay.style.color = o.color;
      overlay.hidden = !o.visible || !video.srcObject;
    }
    let overlayState = null;
    const ov = createOverlay(overlay, video);

    function setStatus(text, live) {
      statusText.textContent = text;
      status.classList.toggle("live", !!live);
    }

    function showOffline() {
      video.srcObject = null;
      overlay.hidden = true;
      placeholder.style.display = "";
      placeholder.textContent = "The camera is offline right now. This page reconnects on its own.";
      setStatus("Offline");
    }

    const peer = new Peer();
    let retryTimer = null;

    function connect() {
      clearTimeout(retryTimer);
      setStatus("Connecting…");
      // Ask the broadcaster to call us back with its stream.
      const conn = peer.connect(STREAM_ID, { reliable: true });
      conn.on("data", msg => {
        if (!msg) return;
        if (msg.type === "overlay") { overlayState = msg; applyOverlay(msg); }
        if (msg.type === "pos") ov.setTarget(msg.head);
      });
      conn.on("close", () => { showOffline(); scheduleRetry(); });
      conn.on("error", () => { showOffline(); scheduleRetry(); });
    }

    function scheduleRetry() {
      clearTimeout(retryTimer);
      retryTimer = setTimeout(connect, 5000);
    }

    peer.on("open", connect);

    peer.on("call", call => {
      call.answer();
      call.on("stream", stream => {
        video.srcObject = stream;
        placeholder.style.display = "none";
        setStatus("Live", true);
        if (overlayState) applyOverlay(overlayState);
      });
      call.on("close", () => { showOffline(); scheduleRetry(); });
    });

    peer.on("error", err => {
      if (err.type === "peer-unavailable") {
        showOffline();
        scheduleRetry();
      } else {
        setStatus("Error: " + err.type);
        scheduleRetry();
      }
    });

    peer.on("disconnected", () => peer.reconnect());
  </script>
</body>
</html>
